services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: fraud-kafka
    ports:
      - "9092:9092"

  postgres:
    image: postgres:17
    container_name: fraud-postgres
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
      POSTGRES_DB: fraud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: